services:
  - type: web
    name: 12mode-api-prod
    runtime: node
    plan: free
    buildCommand: npm run db:build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0

  - type: web
    name: 12mode-web-prod
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://12mode-api-prod.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
