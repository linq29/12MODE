version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: mode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 12mode
    ports:
      - "5432:5432"
    volumes:
      - mode_pg_data:/var/lib/postgresql/data

volumes:
  mode_pg_data:
