<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="十二支詣, 十二支にまつわる神社探し, 十二支, 神社, 動物">
    <meta name="description" content="「十二支詣」──十二支にまつわる神社探し">
    <title>十二支詣</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kosugi+Maru&family=Noto+Sans+JP:wght@100..900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap&family=Kaisei+Decol:wght@400;500;700');
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.png">
</head>

<body class="page-jyunishi">
    <site-decorations></site-decorations>
    <site-logo></site-logo>

    <div class="body-wrapper">
        <site-left-column class="left-column" title-image="images/title-jyunishi.png" title-alt="十二支診断"></site-left-column>

        <div class="center-column">
            <main class="whole">
                <div class="page-icon">
                    <img src="images/icon-jyunishi.png">
                </div>
                <div class="selection-area" id="selectionArea">
                    <h1 class="jyunishi">診断したい年を選んでね！</h1>
                    <select id="yearSelect"></select>
                    <button id="confirmBtn" onclick="showZodiac()">OK！</button>
                </div>

                <div id="resultArea">
                    <img id="zodiacImage" src="" alt="Zodiac Image">
                    <div id="zodiacResult"></div>
                    <button id="retryBtn" onclick="resetSelection()">もう一回</button>
                </div>
            </main>
        </div><!--/.center-column-->

        <site-right-column class="right-column"></site-right-column>
    </div><!--/.body-wrapper-->
    
    <script src="js/layout-components.js"></script>
    <script src="js/jyunishi.js"></script>

</body>

</html>
